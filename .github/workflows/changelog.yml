# This action requires that any PR targeting the main or maintenance branch
# (`v<major>.x`) should touch at least one CHANGELOG file. If a CHANGELOG entry is not
# required, add the "Skip Changelog" label to disable this action.
#
# Maintenance branches are included because each branch keeps its own changelog, and
# scripts/prepare-release.mjs rotates it into that branch's release notes - see
# doc/contributing/releasing.md#changelogs-on-a-maintenance-branch.

name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - 'v[0-9]*.x'
permissions:
  contents: read
jobs:
  changelog:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'dependencies') && !contains(github.event.pull_request.labels.*.name, 'Skip Changelog')}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for CHANGELOG changes
        run: |
          # Only the latest commit of the feature branch is available
          # automatically. To diff with the base branch, we need to
          # fetch that too (and we only need its latest commit).
          git fetch origin ${GITHUB_BASE_REF} --depth=1
          if [[ $(git diff --name-only FETCH_HEAD | grep CHANGELOG) ]]
          then
            echo "A CHANGELOG was modified. Looks good!"
          else
            echo "No CHANGELOG was modified."
            echo "Please add a CHANGELOG entry, or add the \"Skip Changelog\" label if not required."
            false
          fi
