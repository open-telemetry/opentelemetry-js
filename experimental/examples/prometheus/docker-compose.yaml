version: '3.7'

services:
  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - "./prometheus.docker.yml:/etc/prometheus/prometheus.yml"
    ports:
      - 9090:9090
    restart: always
